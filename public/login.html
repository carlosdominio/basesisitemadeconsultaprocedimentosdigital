<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Consulta de Procedimentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>🔐 Sistema de Consulta de Procedimentos</h1>
                <p>Faça login para acessar o sistema</p>
            </div>

            <div class="login-form-container">
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">👤 Usuário</label>
                        <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
                    </div>
                    <div class="form-group">
                        <label for="password">🔒 Senha</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-primary btn-login">Entrar no Sistema</button>
                    </div>
                </form>
                <div id="loginMessage" class="login-message" style="display: none;"></div>
            </div>

        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
